<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Oscar Mezar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Ingresa tus datos para continuar</p>

    <form id="formulario" novalidate>
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username">
      <span class="error" id="error-usuario" role="alert"></span>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" autocomplete="current-password">
      <span class="error" id="error-clave" role="alert"></span>

      <button type="submit">Ingresar</button>
      <p class="mensaje" id="mensaje" role="status"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
